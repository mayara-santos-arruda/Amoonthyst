<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
body {
    background-image: url('Plano de fundo tela de login.png');
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
    background-position: center center;
    font-family: arial;
    margin-top: 100px;
    text-align: center;
    height: 100vh;
    opacity: 75%;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center; 
    align-items: center; 
    overflow: hidden; 
}
.background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; 
}
.cadastro-card {
    background-color: rgba(144, 116, 172, 0.9); 
    padding: 30px 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 400px; 
    color: white; 
}
.cadastro-card h2 {
    text-align: center;
    color: white;
    margin-bottom: 30px;
    font-size: 2rem;
}
.tipo-cadastro-container {
    text-align: left;
    margin-bottom: 20px;
}
.radio-group {
    display: flex;
    gap: 20px;
    margin-top: 10px;
}
.radio-group label {
    display: inline-flex; 
    align-items: center;
    font-weight: normal;
    margin-top: 0;
    margin-bottom: 0;
    cursor: pointer;
}
.radio-group input[type="radio"] {
    margin-right: 5px;
    width: auto; 
}
.login-link-container a:hover {
    color: #fff;
    text-decoration: underline;
}
.cadastro-card label {
    display: block; 
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: 600;
    text-align: left;
}
.cadastro-card input[type="text"],
.cadastro-card input[type="email"],
.cadastro-card input[type="date"],
.cadastro-card input[type="password"] {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    box-sizing: border-box; 
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
}
.cadastro-card input[type="date"] {
    filter: invert(0.8);
}
.login-link-container {
    text-align: center;
    margin-top: 20px;
    font-size: 0.9rem;
}
.login-link-container a {
    color: #7b13dd; 
    text-decoration: none;
    font-weight: bold;
}
.login-link-container a:hover {
    color: #fff;
    text-decoration: underline;
}
.login-link-container a:hover{
    color: rgb(78, 51, 175);
}
.submit-button {
    width: 100%; 
    display: block;
    margin-top: 25px; 
    padding: 12px 0;
    font-size: 1.1rem;
    color: white;
    background-color: #8A2BE2; 
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 700;
    transition: background-color 0.3s;
}
.submit-button:hover {
    background-color: #9370DB; 
}
    </style>
</head>
<body>
    
    <div class="background">
    </div>

    <div class="cadastro-card">
        
        <h2>Cadastro</h2>
        
        <form action="/processar-cadastro" method="POST"> 
            
            <div class="tipo-cadastro-container">
            <label>Tipo de Cadastro:</label>
            <div class="radio-group">
                <input type="radio" id="tipo_pf" name="tipo_cadastro" value="pf" checked onchange="toggleCampos('pf')">
                <label for="tipo_pf">Pessoa Física</label>
                
                <input type="radio" id="tipo_pj" name="tipo_cadastro" value="pj" onchange="toggleCampos('pj')">
                <label for="tipo_pj">Empresa (PJ)</label>
            </div>
        </div>
        
        <div id="campos_pf">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Exemplo: Maria Silva" required>
            
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>
        
        <div id="campos_pj" style="display: none;">
            <label for="razao_social">Razão Social:</label>
            <input type="text" id="razao_social" name="razao_social" placeholder="Nome legal da empresa" required disabled>
            
            <label for="cnpj">CNPJ:</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="XX.XXX.XXX/XXXX-XX" required disabled>
            
            <label for="nome_fantasia">Nome Fantasia:</label>
            <input type="text" id="nome_fantasia" name="nome_fantasia" placeholder="Nome de mercado da empresa" disabled>
        </div>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Exemplo: contato@empresa.com.br" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required minlength="8">

        <label for="confirmar_senha">Confirmar Senha:</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Digite a senha novamente" required minlength="8">
        
        <div class="login-link-container">
            <p>Já tem conta? <a href="login.html">Faça login.</a></p>
        </div>

        <button type="submit" class="submit-button">cadastrar</button>

    </form>
</div>
</body>
</html>
